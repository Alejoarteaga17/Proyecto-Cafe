name: CD - AWS deployment

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Serverless stage"
        required: true
        default: dev
        type: choice
        options: [dev, test, prod]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    env:
      AWS_REGION: us-east-1
      DEPLOY_APP: coffee-cultivation
      STAGE: ${{ inputs.stage }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      QUICKSIGHT_DASHBOARD_ID: ${{ vars.QUICKSIGHT_DASHBOARD_ID }}
      QUICKSIGHT_USER_ARN: ${{ vars.QUICKSIGHT_USER_ARN }}
      SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip pytest boto3
          npm install --global serverless@4.6.2

      - name: Validate Serverless authentication
        run: |
          test -n "$SERVERLESS_ACCESS_KEY" || { echo "Missing SERVERLESS_ACCESS_KEY in the $STAGE environment"; exit 1; }

      - name: Run validation gate
        run: bash scripts/dataops/validate.sh

      - name: Bootstrap Serverless artifact buckets
        run: bash scripts/dataops/bootstrap-serverless-buckets.sh "$STAGE"

      - name: Deploy storage
        working-directory: batch/infrastructure/serverless/storage
        run: serverless deploy --stage "$STAGE"

      - name: Validate QuickSight configuration
        run: |
          test -n "$AWS_ACCOUNT_ID" || { echo "Missing AWS_ACCOUNT_ID in the $STAGE environment"; exit 1; }
          test -n "$QUICKSIGHT_DASHBOARD_ID" || { echo "Missing QUICKSIGHT_DASHBOARD_ID in the $STAGE environment"; exit 1; }
          test -n "$QUICKSIGHT_USER_ARN" || { echo "Missing QUICKSIGHT_USER_ARN in the $STAGE environment"; exit 1; }

      - name: Deploy data platform
        working-directory: batch/infrastructure/serverless/data-platform
        run: |
          serverless deploy --stage "$STAGE" \
            --param="QuickSightEnabled=true" \
            --param="QuickSightPrincipalArn=$QUICKSIGHT_USER_ARN"

      - name: Publish Glue artifacts
        run: bash scripts/dataops/publish-glue.sh "$STAGE"

      - name: Resolve deployment outputs
        id: deployment
        run: |
          storage_stack="${DEPLOY_APP}-storage"
          platform_stack="${DEPLOY_APP}-data-platform"
          if [[ "$STAGE" != "dev" ]]; then
            storage_stack="${storage_stack}-${STAGE}"
            platform_stack="${platform_stack}-${STAGE}"
          fi
          domain=$(aws ssm get-parameter \
            --name "/${storage_stack}/FrontendDistributionDomainName" \
            --query 'Parameter.Value' \
            --output text)
          historical_arn=$(aws cloudformation describe-stacks \
            --stack-name "$platform_stack" \
            --query "Stacks[0].Outputs[?OutputKey=='HistoricalStateMachineArn'].OutputValue | [0]" \
            --output text)
          echo "frontend_domain=${domain}" >> "$GITHUB_OUTPUT"
          echo "historical_arn=${historical_arn}" >> "$GITHUB_OUTPUT"

      - name: Deploy batch API
        working-directory: batch/serverless
        env:
          QUICKSIGHT_ALLOWED_DOMAINS: https://${{ steps.deployment.outputs.frontend_domain }}
          HISTORICAL_STATE_MACHINE_ARN: ${{ steps.deployment.outputs.historical_arn }}
        run: serverless deploy --stage "$STAGE"

      - name: Deploy IoT ingestion
        working-directory: streaming/infrastructure/serverless/iot
        run: serverless deploy --stage "$STAGE"

      - name: Publish frontend
        run: |
          storage_stack="${DEPLOY_APP}-storage"
          api_stack="${DEPLOY_APP}-backend-batch"
          if [[ "$STAGE" != "dev" ]]; then
            storage_stack="${storage_stack}-${STAGE}"
            api_stack="${api_stack}-${STAGE}"
          fi

          bucket=$(aws ssm get-parameter \
            --name "/${storage_stack}/FrontendBucketName" \
            --query 'Parameter.Value' \
            --output text)
          api_id=$(aws cloudformation describe-stack-resources \
            --stack-name "$api_stack" \
            --logical-resource-ids ApiGatewayRestApi \
            --query 'StackResources[0].PhysicalResourceId' \
            --output text)
          api_base_url="https://${api_id}.execute-api.${AWS_REGION}.amazonaws.com/${STAGE}"

          printf "window.COFFEE_CONFIG = { apiBaseUrl: '%s' };\n" "$api_base_url" > frontend/config.js
          aws s3 sync frontend "s3://${bucket}" --delete
          distribution_id=$(aws cloudformation describe-stack-resources \
            --stack-name "$storage_stack" \
            --logical-resource-ids FrontendDistribution \
            --query 'StackResources[0].PhysicalResourceId' \
            --output text)
          aws cloudfront create-invalidation \
            --distribution-id "$distribution_id" \
            --paths '/*'
