AWSTemplateFormatVersion: "2010-09-09"
Description: OIDC deployment role for this repository's GitHub Actions workflows.

Parameters:
  GitHubRepository:
    Type: String
    Default: Alejoarteaga17/Proyecto-Cafe
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
  RoleName:
    Type: String
    Default: coffee-cultivation-github-actions

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Deployment role restricted to this repository and its protected environments.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubRepository}:environment:dev
                  - !Sub repo:${GitHubRepository}:environment:test
                  - !Sub repo:${GitHubRepository}:environment:prod
                  - repo:Alejoarteaga17@120742659/Proyecto-Cafe@1350180841:environment:dev
                  - repo:Alejoarteaga17@120742659/Proyecto-Cafe@1350180841:environment:test
                  - repo:Alejoarteaga17@120742659/Proyecto-Cafe@1350180841:environment:prod
      Policies:
        - PolicyName: coffee-cultivation-ci-cd
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageProjectCloudFormation
                Effect: Allow
                Action: cloudformation:*
                Resource: "*"
              - Sid: ManageProjectArtifacts
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:DeleteBucketPolicy
                  - s3:DeleteBucketTagging
                  - s3:GetBucketPolicy
                  - s3:GetBucketTagging
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:PutBucketPolicy
                  - s3:PutBucketTagging
                  - s3:PutEncryptionConfiguration
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketVersioning
                  - s3:PutObjectTagging
                Resource:
                  - !Sub arn:aws:s3:::${AWS::AccountId}-*
                  - !Sub arn:aws:s3:::${AWS::AccountId}-*/*
                  - arn:aws:s3:::coffee-cultivation-*
                  - arn:aws:s3:::coffee-cultivation-*/*
                  - arn:aws:s3:::us-east-1-cfn-storage-*
                  - arn:aws:s3:::us-east-1-cfn-storage-*/*
                  - arn:aws:s3:::us-east-1-cfn-data-platform-*
                  - arn:aws:s3:::us-east-1-cfn-data-platform-*/*
                  - arn:aws:s3:::us-east-1-cfn-backend-batch-*
                  - arn:aws:s3:::us-east-1-cfn-backend-batch-*/*
                  - arn:aws:s3:::us-east-1-cfn-iot-*
                  - arn:aws:s3:::us-east-1-cfn-iot-*/*
              - Sid: ReadProjectParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/coffee-cultivation-*
              - Sid: PassProjectRolesToCloudFormation
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/coffee-cultivation-*
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/data-platform-*
              - Sid: ManageProjectResources
                Effect: Allow
                Action:
                  - apigateway:*
                  - athena:*
                  - firehose:*
                  - glue:*
                  - iam:AttachRolePolicy
                  - iam:CreateRole
                  - iam:CreateServiceLinkedRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:UpdateRoleDescription
                  - iam:UntagRole
                  - iot:*
                  - lambda:*
                  - logs:*
                  - quicksight:*
                  - states:*
                Resource: "*"
              - Sid: ManageProjectParameters
                Effect: Allow
                Action:
                  - ssm:DeleteParameter
                  - ssm:PutParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/coffee-cultivation-*
              - Sid: ReadDeploymentIdentity
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: "*"
              - Sid: PublishFrontend
                Effect: Allow
                Action:
                  - cloudfront:*
                Resource: "*"
              - Sid: StartProjectDataOps
                Effect: Allow
                Action:
                  - cloudformation:ListExports
                  - states:StartExecution
                Resource: "*"

Outputs:
  GitHubActionsRoleArn:
    Description: Store this value as AWS_DEPLOY_ROLE_ARN in each GitHub environment.
    Value: !GetAtt GitHubActionsRole.Arn
