Resources:
  SensorThingName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${AWS::StackName}/SensorThingName
      Tier: Standard
      Type: String
      Value: !Ref SensorThing

  SensorReadingsPolicyName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${AWS::StackName}/SensorReadingsPolicyName
      Tier: Standard
      Type: String
      Value: !Ref SensorReadingsPolicy
