service: iot
frameworkVersion: '^4.6.2'
configValidationMode: error

provider:
  name: aws
  stage: dev
  region: us-east-1
  stackName: ${env:DEPLOY_APP, 'coffee-cultivation'}-${self:service}
resources:
  - ${file(iot.yml)}
  - ${file(parameters.yml)}

custom:
  stage: ${opt:stage, self:provider.stage}
  servicePrefix: ${env:DEPLOY_APP, 'coffee-cultivation'}-${self:service}
  developer: ${env:DEVELOPER, 'aaccode'}
  s3:
    deploymentBucketName:
      dev: ${self:provider.region}-cfn-${self:service}-${self:custom.stage}-${self:custom.developer}-deploys
      test: ${self:provider.region}-cfn-${self:service}-${self:custom.stage}-deploys
      prod: ${self:provider.region}-cfn-${self:service}-${self:custom.stage}-deploys
    dataLakeBucket:
      name: ${ssm:/${env:DEPLOY_APP, 'coffee-cultivation'}-storage/DataLakeBucketName}
      arn: ${ssm:/${env:DEPLOY_APP, 'coffee-cultivation'}-storage/DataLakeBucketArn}
  iot:
    ruleName:
      dev: sensor_readings_${self:custom.stage}_${self:custom.developer}
      test: sensor_readings_${self:custom.stage}
      prod: sensor_readings_${self:custom.stage}
