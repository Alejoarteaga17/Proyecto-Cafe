service: iot
frameworkVersion: '^4.6.2'
configValidationMode: error

provider:
  name: aws
  stage: dev
  region: us-east-1
  stackName: ${self:custom.stackName.${self:custom.stage}}
resources:
  - ${file(iot.yml)}
  - ${file(parameters.yml)}

custom:
  stage: ${opt:stage, self:provider.stage}
  stackName:
    dev: ${env:DEPLOY_APP, 'coffee-cultivation'}-${self:service}
    test: ${env:DEPLOY_APP, 'coffee-cultivation'}-${self:service}-test
    prod: ${env:DEPLOY_APP, 'coffee-cultivation'}-${self:service}-prod
  storageStackName:
    dev: ${env:DEPLOY_APP, 'coffee-cultivation'}-storage
    test: ${env:DEPLOY_APP, 'coffee-cultivation'}-storage-test
    prod: ${env:DEPLOY_APP, 'coffee-cultivation'}-storage-prod
  servicePrefix:
    dev: ${env:DEPLOY_APP, 'coffee-cultivation'}-${self:service}
    test: ${env:DEPLOY_APP, 'coffee-cultivation'}-${self:service}-test
    prod: ${env:DEPLOY_APP, 'coffee-cultivation'}-${self:service}-prod
  developer: ${env:DEVELOPER, 'aaccode'}
  s3:
    deploymentBucketName:
      dev: ${self:provider.region}-cfn-${self:service}-${self:custom.stage}-${self:custom.developer}-deploys
      test: ${self:provider.region}-cfn-${self:service}-${self:custom.stage}-deploys
      prod: ${self:provider.region}-cfn-${self:service}-${self:custom.stage}-deploys
    dataLakeBucket:
      name: ${ssm:/${self:custom.storageStackName.${self:custom.stage}}/DataLakeBucketName}
      arn: ${ssm:/${self:custom.storageStackName.${self:custom.stage}}/DataLakeBucketArn}
  iot:
    ruleName:
      dev: sensor_readings_${self:custom.stage}_${self:custom.developer}
      test: sensor_readings_${self:custom.stage}
      prod: sensor_readings_${self:custom.stage}
