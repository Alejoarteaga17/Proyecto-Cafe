Resources:
  SensorThing:
    Type: AWS::IoT::Thing
    Properties:
      ThingName: ${self:custom.servicePrefix}-sensor-simulator
      AttributePayload:
        Attributes:
          device_type: coffee-sensor
          ingestion: iot-core-firehose

  SensorReadingsPolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: ${self:custom.servicePrefix}-sensor-readings-${self:custom.stage}
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource:
              !Join [
                '',
                [
                  'arn:aws:iot:',
                  !Ref AWS::Region,
                  ':',
                  !Ref AWS::AccountId,
                  ':client/${iot:Connection.Thing.ThingName}',
                ],
              ]
          - Effect: Allow
            Action: iot:Publish
            Resource:
              - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/sensors/coffee/ST-01/data
              - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/sensors/coffee/ST-02/data
              - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/sensors/coffee/ST-03/data
              - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/sensors/coffee/ST-04/data

  SensorReadingsTopicRuleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ${self:custom.servicePrefix}-TopicRule
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: iot.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ${self:custom.servicePrefix}-TopicRule
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - firehose:PutRecord
                  - firehose:PutRecordBatch
                Resource: !GetAtt SensorFirehose.Arn

  SensorReadingsTopicRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: ${self:custom.iot.ruleName.${self:custom.stage}}
      TopicRulePayload:
        # topic(3) is the sensor-id segment of sensors/coffee/<sensor-id>/data.
        # The policy limits publication to the four simulator sensor topics.
        # The payload itself carries no sensor_id, so the topic remains the
        # authoritative source for the derived identity.
        Sql: "SELECT *, topic(3) AS sensor_id FROM 'sensors/coffee/+/data'"
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Actions:
          - Firehose:
              DeliveryStreamName: !Ref SensorFirehose
              RoleArn: !GetAtt SensorReadingsTopicRuleRole.Arn
              Separator: "\n"

  SensorFirehose:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamType: DirectPut
      ExtendedS3DestinationConfiguration:
        BucketARN: ${self:custom.s3.dataLakeBucket.arn}
        RoleARN: !GetAtt FirehoseDeliveryRole.Arn
        Prefix: bronze/iot/year=!{timestamp:yyyy}/month=!{timestamp:MM}/day=!{timestamp:dd}/
        ErrorOutputPrefix: bronze/iot-errors/!{firehose:error-output-type}/
        BufferingHints:
          IntervalInSeconds: 60
          SizeInMBs: 5
        CompressionFormat: GZIP

  FirehoseDeliveryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ${self:custom.servicePrefix}-FirehoseDelivery
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ${self:custom.servicePrefix}-FirehoseS3
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                Resource: ${self:custom.s3.dataLakeBucket.arn}
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                Resource:
                  - ${self:custom.s3.dataLakeBucket.arn}/bronze/iot/*
                  - ${self:custom.s3.dataLakeBucket.arn}/bronze/iot-errors/*
