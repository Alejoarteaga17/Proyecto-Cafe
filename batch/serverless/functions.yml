ValidateAndStore:
  name: ${self:custom.servicePrefix}-ValidateAndStore
  handler: src/validate_and_store/handler.handler
  role: !GetAtt ValidateAndStoreRole.Arn
  timeout: 25
  memorySize: 256
  package:
    patterns:
      - ../../src/common/**
      - ../../src/validate_and_store/**
  environment:
    BRONZE_BUCKET_NAME: ${self:custom.s3.dataLakeBucket.name}
  events:
    - http:
        path: /coffee-historical-data
        method: post
        private: true
