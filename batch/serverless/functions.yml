GenerateUploadUrl:
  name: ${self:custom.servicePrefix}-GenerateUploadUrl
  handler: src/generate_upload_url/handler.handler
  role: !GetAtt GenerateUploadUrlRole.Arn
  timeout: 10
  memorySize: 128
  package:
    patterns:
      - ../../src/generate_upload_url/**
  environment:
    DATA_LAKE_BUCKET_NAME: ${self:custom.s3.dataLakeBucket.name}
  events:
    - http:
        path: /coffee-historical-data/upload-url
        method: post
        private: true
