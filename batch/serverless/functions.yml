GenerateUploadUrl:
  name: ${self:custom.servicePrefix}-GenerateUploadUrl
  handler: src/generate_upload_url/handler.handler
  role: !GetAtt GenerateUploadUrlRole.Arn
  timeout: 10
  memorySize: 128
  package:
    patterns:
    - ../src/common/**
    - ../src/validate_and_store/**
  environment:
    BRONZE_BUCKET_NAME: ${self:custom.s3.dataLakeBucket.name}
  events:
    - http:
        path: /coffee-historical-data/upload-url
        method: post
        private: true
        cors: true

Cors:
  name: ${self:custom.servicePrefix}-Cors
  handler: src/validate_and_store/cors_handler.handler
  timeout: 5
  memorySize: 128
  package:
    patterns:
    - ../src/validate_and_store/**
  events:
    - http:
        path: /coffee-historical-data
        method: options
        private: false
