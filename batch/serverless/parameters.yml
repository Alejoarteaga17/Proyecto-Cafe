Resources:
  GenerateUploadUrlLambdaName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${AWS::StackName}/GenerateUploadUrlLambdaName
      Tier: Standard
      Type: String
      Value: ${self:custom.servicePrefix}-GenerateUploadUrl

  GenerateUploadUrlLambdaArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${AWS::StackName}/GenerateUploadUrlLambdaArn
      Tier: Standard
      Type: String
      Value: !GetAtt GenerateUploadUrlLambdaFunction.Arn
