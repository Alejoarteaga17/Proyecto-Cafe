service: queue
frameworkVersion: '^4.6.2'
configValidationMode: error

provider:
  name: aws
  stage: dev
  region: us-east-1
  stackName: ${env:DEPLOY_APP, 'coffee-cultivation'}-${self:service}
  deploymentBucket:
    name: ${self:custom.s3.deploymentBucketName.${self:custom.stage}}

plugins:
  - serverless-deployment-bucket
  - '@serverless/safeguards-plugin'

resources:
  - ${file(sqs.yml)}
  - ${file(parameters.yml)}

custom:
  stage: ${opt:stage, self:provider.stage}
  safeguards:
    - safeguard: framework-version
      enforcementLevel: warning
      config: ${self:frameworkVersion}
    - safeguard: allowed-regions
      enforcementLevel: error
      config:
        - ${self:provider.region}
    - safeguard: allowed-stages
      enforcementLevel: error
      config:
        - dev
        - test
        - prod
  servicePrefix: ${env:DEPLOY_APP, 'coffee-cultivation'}-${self:service}
  developer: ${env:DEVELOPER, 'aaccode'}
  s3:
    deploymentBucketName:
      dev: ${self:provider.region}-cfn-${self:service}-${self:custom.stage}-${self:custom.developer}-deploys
      test: ${self:provider.region}-cfn-${self:service}-${self:custom.stage}-deploys
      prod: ${self:provider.region}-cfn-${self:service}-${self:custom.stage}-deploys
  queue:
    coffeeBatch:
      name:
        dev: ${env:DEPLOY_APP, 'coffee-cultivation'}-coffee-batch-queue-${self:custom.stage}-${self:custom.developer}
        test: ${env:DEPLOY_APP, 'coffee-cultivation'}-coffee-batch-queue-${self:custom.stage}
        prod: ${env:DEPLOY_APP, 'coffee-cultivation'}-coffee-batch-queue-${self:custom.stage}
      dlqName:
        dev: ${env:DEPLOY_APP, 'coffee-cultivation'}-coffee-batch-dlq-${self:custom.stage}-${self:custom.developer}
        test: ${env:DEPLOY_APP, 'coffee-cultivation'}-coffee-batch-dlq-${self:custom.stage}
        prod: ${env:DEPLOY_APP, 'coffee-cultivation'}-coffee-batch-dlq-${self:custom.stage}
      visibilityTimeout: 60
      maxReceiveCount: 3
    sensorReadings:
      name:
        dev: ${env:DEPLOY_APP, 'coffee-cultivation'}-coffee-sensor-readings-${self:custom.stage}-${self:custom.developer}
        test: ${env:DEPLOY_APP, 'coffee-cultivation'}-coffee-sensor-readings-${self:custom.stage}
        prod: ${env:DEPLOY_APP, 'coffee-cultivation'}-coffee-sensor-readings-${self:custom.stage}
      dlqName:
        dev: ${env:DEPLOY_APP, 'coffee-cultivation'}-coffee-sensor-readings-dlq-${self:custom.stage}-${self:custom.developer}
        test: ${env:DEPLOY_APP, 'coffee-cultivation'}-coffee-sensor-readings-dlq-${self:custom.stage}
        prod: ${env:DEPLOY_APP, 'coffee-cultivation'}-coffee-sensor-readings-dlq-${self:custom.stage}
      visibilityTimeout: 60
      maxReceiveCount: 3
