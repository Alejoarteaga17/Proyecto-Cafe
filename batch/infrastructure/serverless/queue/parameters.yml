Resources:
  CoffeeBatchQueueUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${AWS::StackName}/CoffeeBatchQueueUrl
      Tier: Standard
      Type: String
      Value: !Ref CoffeeBatchQueue

  CoffeeBatchQueueArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${AWS::StackName}/CoffeeBatchQueueArn
      Tier: Standard
      Type: String
      Value: !GetAtt CoffeeBatchQueue.Arn

  CoffeeBatchDLQName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${AWS::StackName}/CoffeeBatchDLQName
      Tier: Standard
      Type: String
      Value: ${self:custom.queue.coffeeBatch.dlqName.${self:custom.stage}}

  CoffeeBatchDLQUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${AWS::StackName}/CoffeeBatchDLQUrl
      Tier: Standard
      Type: String
      Value: !Ref CoffeeBatchDLQ

  CoffeeBatchDLQArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${AWS::StackName}/CoffeeBatchDLQArn
      Tier: Standard
      Type: String
      Value: !GetAtt CoffeeBatchDLQ.Arn

  SensorReadingsQueueUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${AWS::StackName}/SensorReadingsQueueUrl
      Tier: Standard
      Type: String
      Value: !Ref SensorReadingsQueue

  SensorReadingsQueueArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${AWS::StackName}/SensorReadingsQueueArn
      Tier: Standard
      Type: String
      Value: !GetAtt SensorReadingsQueue.Arn

  SensorReadingsDLQName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${AWS::StackName}/SensorReadingsDLQName
      Tier: Standard
      Type: String
      Value: ${self:custom.queue.sensorReadings.dlqName.${self:custom.stage}}

  SensorReadingsDLQUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${AWS::StackName}/SensorReadingsDLQUrl
      Tier: Standard
      Type: String
      Value: !Ref SensorReadingsDLQ

  SensorReadingsDLQArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${AWS::StackName}/SensorReadingsDLQArn
      Tier: Standard
      Type: String
      Value: !GetAtt SensorReadingsDLQ.Arn
