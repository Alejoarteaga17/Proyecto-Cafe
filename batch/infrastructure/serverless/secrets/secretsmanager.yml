Resources:
  MongoCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub /${self:custom.servicePrefix}/MongoCredentials
      Description: MongoDB Atlas connection credentials for the coffee cultivation platform
      SecretString: !Sub |
        {
          "host": "${env:MONGO_HOST}",
          "username": "${env:MONGO_USERNAME}",
          "password": "${env:MONGO_PASSWORD}",
          "dbname": "${env:MONGO_DBNAME}"
        }
      Tags:
        # Read by database/seeders/seed.sh to refuse seeding synthetic data
        # into anything other than dev/test.
        - Key: STAGE
          Value: ${self:custom.stage}

